version: "2"

# Tests behind build tags are checked too.
run:
  build-tags:
    - integration
    - e2e

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gocritic
    - gocyclo
    - godox
    - gosec
    - govet
    - interfacebloat
    - ireturn
    - nilerr
    - nilnil
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unparam
    - unused

  settings:
    depguard:
      rules:
        # AS-7: hand-written fakes, never generated mocks or testify.
        everywhere:
          files:
            - $all
          deny:
            - pkg: github.com/golang/mock
              desc: "AS-7: use a hand-written fake against the port"
            - pkg: go.uber.org/mock
              desc: "AS-7: use a hand-written fake against the port"
            - pkg: github.com/vektra/mockery
              desc: "AS-7: use a hand-written fake against the port"
            - pkg: github.com/stretchr/testify
              desc: "AS-7: use testing + go-cmp"
        # AS-6. What else the domain may import is checked by internal/archtest (ADR-0001 amendment):
        # depguard cannot express "the facades the DAG allows its module".
        domain:
          files:
            - "**/internal/domain/**"
            - "!$test"
          deny:
            - pkg: reflect
              desc: "AS-6: no reflection in the domain"
            - pkg: unsafe
              desc: "AS-6: no unsafe in the domain"
        # ADR-0009: use cases talk to the database only through their ports. AS-6.
        app:
          files:
            - "**/internal/app/**"
            - "!$test"
          deny:
            - pkg: github.com/jackc/pgx
              desc: "ADR-0009: pgx only in adapters"
            - pkg: reflect
              desc: "AS-6: no reflection in use cases"
            - pkg: unsafe
              desc: "AS-6: no unsafe in use cases"

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: "AS-11: return an error; panic only in main and in tests"
        - pattern: ^float(32|64)$
          msg: "ADR-0005: amounts in money.Amount (int64 minor units)"
        - pattern: ^time\.Now$
          msg: "ADR-0006: the domain receives a clock.Clock"

    funlen:
      lines: 50
      statements: -1
      ignore-comments: true

    gocyclo:
      min-complexity: 10

    godox:
      keywords:
        - TODO
        - FIXME
        - HACK
        - XXX

    interfacebloat:
      max: 5

    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        # The strict interface generated by oapi-codegen forces returning its ResponseObject types.
        - github.com/DrewGGM/aluna/internal/httpapi/gen\..*ResponseObject

    nolintlint:
      require-specific: true
      require-explanation: true
      allow-unused: false

  exclusions:
    rules:
      # AS-11: main and tests may panic.
      - linters: [forbidigo]
        text: "AS-11"
        path: (^|/)cmd/|_test\.go$
      # ADR-0005: floats are forbidden only where there is money.
      - linters: [forbidigo]
        text: "ADR-0005"
        path-except: (^|/)internal/(money|ledger|deposits|pricing)/
      # ADR-0006: time.Now is forbidden only in the domain.
      - linters: [forbidigo]
        text: "ADR-0006"
        path-except: (^|/)internal/domain/
      # AS-15: a TODO only exists with its task, TODO(T-0NN).
      - linters: [godox]
        text: ': "TODO\(T-\d{3}\)'

# Every finding is shown: with per-line deduplication a float64 stayed hidden behind another linter
# flagging the same line.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

formatters:
  enable:
    - gofumpt
