# Generates the server from api/openapi.yaml (ADR-0010): models and a strict server on net/http.
# It runs with go generate ./internal/httpapi/... (the directive is in server.go), so the output is
# relative to internal/httpapi.
package: gen
output: gen/gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
