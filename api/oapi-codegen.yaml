# Generación del servidor desde api/openapi.yaml (ADR-0010): modelos y servidor strict sobre net/http.
# Se corre con go generate ./internal/httpapi/... (la directiva está en server.go), así que la
# salida es relativa a internal/httpapi.
package: gen
output: gen/gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
