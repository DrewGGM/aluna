openapi: 3.1.0
info:
  title: Aluna API
  version: 0.1.0
  description: >-
    Core banking. Money is always {"amount": <integer in minor units>, "currency": "<ISO 4217>"}, never
    decimals. Errors are RFC 9457 (application/problem+json) with a stable `code`. Every operation
    declares the permission it requires in `x-aluna-permission`. Amounts are 64-bit integers: a
    JavaScript client must read them as BigInt, because they exceed 2^53.
servers:
  - url: /
paths:
  /v1/ledger-accounts:
    post:
      operationId: createLedgerAccount
      summary: Create a ledger account
      x-aluna-permission: ledger.accounts.create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateLedgerAccount"}
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LedgerAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/ledger-accounts/{id}:
    get:
      operationId: getLedgerAccount
      summary: Read a ledger account
      x-aluna-permission: ledger.accounts.read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LedgerAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/ledger-accounts/{id}/balance:
    get:
      operationId: getLedgerAccountBalance
      summary: Read an account balance
      description: >-
        Without parameters, the materialized balance, with the pending amounts of the holds. With
        `as_of_value_date` or `as_known_at`, the bitemporal balance (FR-8): the sum of the entries with a
        value date up to `as_of_value_date` and posted up to `as_known_at`, without pending amounts; a
        missing cutoff does not filter. On an async account the materialized balance may lag behind and the
        bitemporal one does not.
      x-aluna-permission: ledger.balances.read
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: as_of_value_date
          in: query
          description: Value date cutoff (inclusive). Empty (or 0001-01-01) counts as absent.
          schema: {type: string, format: date}
        - name: as_known_at
          in: query
          description: >-
            Balance as it was known at this RFC 3339 instant (posted_at up to it, inclusive; it applies
            in UTC and in microseconds, and is returned that way). posted_at is the insertion time and not
            the commit time, so the cutoff is final only for instants before the longest transaction in
            progress. Empty (or the zero instant) counts as absent.
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Balance"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/transactions:
    post:
      operationId: postTransaction
      summary: Post a balanced transaction
      description: >-
        Idempotent by `Idempotency-Key` (7 days): the same payload with the same key receives the
        original response (also a business 4xx) without posting again; another payload is 422
        `idempotency_key_reused` and a request that has not finished, 409 `request_in_progress`. A 5xx is
        not stored: it can be retried with the same key.
      x-aluna-permission: ledger.transactions.post
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PostTransaction"}
      responses:
        "201":
          description: Transaction posted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/transactions/{id}:
    get:
      operationId: getTransaction
      summary: Read a transaction
      x-aluna-permission: ledger.transactions.read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/transactions/{id}/reversal:
    post:
      operationId: requestReversal
      summary: Request the reversal of a transaction
      description: >-
        Creates a maker-checker `ledger.reversal` request and answers 202 with it. The reversal is posted
        (its entries with the opposite sign) when another person with `ledger.transactions.reverse`
        approves it in `POST /v1/approvals/{id}/approval`; if the ledger rejects it then (already
        reversed, period closed, insufficient funds), the request ends up `failed`. The reversal of a
        reversal is rejected when requested (409 `reversal_of_reversal`). Idempotent by
        `Idempotency-Key`.
      x-aluna-permission: ledger.transactions.reverse
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RequestReversal"}
      responses:
        "202":
          description: Reversal request created, pending approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/holds:
    post:
      operationId: placeHold
      summary: Hold funds of an account
      description: >-
        Creates a pending hold on a sync account: the amount stops being available until it is captured,
        released or expires. Idempotent by `Idempotency-Key`, like `POST /v1/transactions`.
      x-aluna-permission: ledger.holds.place
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlaceHold"}
      responses:
        "201":
          description: Hold created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hold"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/holds/{id}/capture:
    post:
      operationId: captureHold
      summary: Capture a hold, fully or partially
      description: >-
        Posts the requested amount from the hold's account to its counterpart and releases the rest. A hold
        that is no longer pending answers 409 `hold_not_pending`; an expired one, 409 `hold_expired`; an
        amount larger than the held one, 422 `amount_exceeds_hold`.
      x-aluna-permission: ledger.holds.capture
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CaptureHold"}
      responses:
        "200":
          description: Captured hold and its transaction
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HoldCapture"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/holds/{id}/release:
    post:
      operationId: releaseHold
      summary: Release a hold
      x-aluna-permission: ledger.holds.release
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Hold released
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hold"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/approvals:
    get:
      operationId: listApprovals
      summary: Maker-checker requests of the entity
      description: >-
        The 100 most recent, from newest to oldest. With `status`, only those in that status; `expired` is
        a pending one that passed its 7 days.
      x-aluna-permission: approvals.read
      parameters:
        - name: status
          in: query
          required: false
          schema: {$ref: "#/components/schemas/ApprovalStatus"}
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalList"}
        "400": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/approvals/{id}/approval:
    post:
      operationId: approveRequest
      summary: Approve a request
      description: >-
        Runs the requested command with its original payload, in the same transaction that marks the
        request `approved`. The approver cannot be the requester (403 `self_approval_forbidden`) and needs
        the permission of the request kind. If the command fails, the request ends up `failed` and the
        answer is 200 with that status. Idempotent by `Idempotency-Key`.
      x-aluna-permission: approvals.decide
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Request decided (approved or failed)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/approvals/{id}/rejection:
    post:
      operationId: rejectRequest
      summary: Reject a request
      description: >-
        The command does not run. The rejecter cannot be the requester (403 `self_approval_forbidden`) and
        needs the permission of the request kind.
      x-aluna-permission: approvals.decide
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RejectApproval"}
      responses:
        "200":
          description: Request rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/parties:
    post:
      operationId: registerParty
      summary: Register a party
      description: >-
        Registers the reference data of a natural or legal person (FR-16) with its first version, in KYC
        `pending`: the KYC status only changes through maker-checker. The core keeps no names or
        documents: `external_ref` points to the onboarding system and is unique within the entity (409
        `party_already_registered`).
      x-aluna-permission: party.parties.create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterParty"}
      responses:
        "201":
          description: Registered party
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Party"}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/parties/{id}:
    get:
      operationId: getParty
      summary: Read a party
      description: The party with its current version.
      x-aluna-permission: party.parties.read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Party
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Party"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
  responses:
    Problem:
      description: RFC 9457 error
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: Minor units of the currency (COP 100,000 = 10000000).
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    Problem:
      type: object
      required: [type, title, status, code, instance]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        instance: {type: string}
        trace_id:
          type: string
          description: Trace of the request (W3C), to look it up in the logs and the tracing backend.
    AccountKind:
      type: string
      enum: [asset, liability, equity, income, expense]
    BalanceMode:
      type: string
      enum: [sync, async]
    CreateLedgerAccount:
      type: object
      required: [code, kind, currency, balance_mode]
      properties:
        code: {type: string, minLength: 1}
        kind: {$ref: "#/components/schemas/AccountKind"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        balance_mode: {$ref: "#/components/schemas/BalanceMode"}
        lower_limit:
          type: integer
          format: int64
          description: Lower limit of the natural balance, in minor units (0 by default).
    LedgerAccount:
      type: object
      required: [id, code, kind, currency, balance_mode, lower_limit]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        kind: {$ref: "#/components/schemas/AccountKind"}
        currency: {type: string}
        balance_mode: {$ref: "#/components/schemas/BalanceMode"}
        lower_limit: {type: integer, format: int64}
    Balance:
      type: object
      required: [account_id, posted, natural]
      properties:
        account_id: {type: string, format: uuid}
        as_of_value_date:
          type: string
          format: date
          description: Value date cutoff of the bitemporal balance; absent in the materialized one.
        as_known_at:
          type: string
          format: date-time
          description: Knowledge cutoff of the bitemporal balance; absent in the materialized one.
        posted:
          $ref: "#/components/schemas/Money"
          description: Signed balance (debit positive, credit negative).
        natural:
          $ref: "#/components/schemas/Money"
          description: Balance in the account's natural sign (a customer deposit is positive).
        pending_debits:
          $ref: "#/components/schemas/Money"
          description: Pending debit holds (non-negative amount). Only in the materialized balance.
        pending_credits:
          $ref: "#/components/schemas/Money"
          description: Pending credit holds (non-negative amount). Only in the materialized balance.
        version:
          type: integer
          format: int64
          description: Version of the materialized balance. Only in the materialized balance.
    Entry:
      type: object
      required: [account_id, amount]
      properties:
        account_id: {type: string, format: uuid}
        amount:
          $ref: "#/components/schemas/Money"
          description: Signed, debit positive and credit negative.
    PostTransaction:
      type: object
      required: [code, value_date, business_date, source, external_ref, entries]
      properties:
        code: {type: string, minLength: 1}
        value_date: {type: string, format: date}
        business_date: {type: string, format: date}
        source: {type: string, minLength: 1}
        external_ref: {type: string, minLength: 1}
        entries:
          type: array
          minItems: 2
          items: {$ref: "#/components/schemas/Entry"}
    Transaction:
      type: object
      required: [id, code, value_date, business_date, posted_at, source, external_ref, entries]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        value_date: {type: string, format: date}
        business_date: {type: string, format: date}
        posted_at: {type: string, format: date-time}
        source: {type: string}
        external_ref: {type: string}
        entries:
          type: array
          items: {$ref: "#/components/schemas/Entry"}
    PlaceHold:
      type: object
      required: [account_id, counter_account_id, amount, expires_at]
      properties:
        account_id: {type: string, format: uuid, description: Account whose funds are held}
        counter_account_id: {type: string, format: uuid, description: Account that receives the captured amount}
        amount: {$ref: "#/components/schemas/Money"}
        expires_at: {type: string, format: date-time}
    CaptureHold:
      type: object
      required: [amount, business_date]
      properties:
        amount: {$ref: "#/components/schemas/Money"}
        business_date: {type: string, format: date}
    HoldStatus:
      type: string
      enum: [pending, captured, released, expired]
    Hold:
      type: object
      required: [id, account_id, counter_account_id, amount, captured, status, expires_at]
      properties:
        id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        counter_account_id: {type: string, format: uuid}
        amount: {$ref: "#/components/schemas/Money"}
        captured: {$ref: "#/components/schemas/Money"}
        status: {$ref: "#/components/schemas/HoldStatus"}
        expires_at: {type: string, format: date-time}
    HoldCapture:
      type: object
      required: [hold, transaction]
      properties:
        hold: {$ref: "#/components/schemas/Hold"}
        transaction: {$ref: "#/components/schemas/Transaction"}
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, failed, expired]
    Approval:
      type: object
      required: [id, kind, status, payload, maker, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, description: "Request kind; each module registers its own"}
        status: {$ref: "#/components/schemas/ApprovalStatus"}
        payload:
          description: The requested command, as it will run when approved.
          x-go-type: json.RawMessage
        maker: {type: string, description: sub of the requester}
        checker: {type: string, description: sub of the decider}
        reason: {type: string, description: Rejection reason}
        result:
          description: What the approved command returned.
          x-go-type: json.RawMessage
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
    ApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Approval"}
    RejectApproval:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}
    RequestReversal:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}
        business_date:
          type: string
          format: date
          description: Business date of the reversal; by default, the entity's when approved.
    PartyKind:
      type: string
      enum: [natural, legal]
      description: Natural or legal person.
    KYCStatus:
      type: string
      enum: [pending, approved, rejected, suspended]
    RiskLevel:
      type: string
      enum: [low, medium, high]
    RegisterParty:
      type: object
      required: [kind, external_ref, risk_level, pep]
      properties:
        kind: {$ref: "#/components/schemas/PartyKind"}
        external_ref: {type: string, minLength: 1, maxLength: 255, description: Reference in the onboarding system}
        risk_level: {$ref: "#/components/schemas/RiskLevel"}
        pep:
          type: boolean
          description: Politically exposed person. Required; a missing or null value is rejected, never read as false.
          x-go-type: "*bool"
        consents:
          type: object
          additionalProperties: {type: boolean}
          propertyNames: {pattern: "^[a-z][a-z0-9_]{0,63}$"}
          maxProperties: 32
          description: >-
            Consent by name (for example, personal_data): lowercase letters, digits and underscores, starting
            with a letter, up to 64 characters.
    Party:
      type: object
      required: [id, kind, external_ref, created_at, version, kyc_status, risk_level, pep, consents, valid_from]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/PartyKind"}
        external_ref: {type: string}
        created_at: {type: string, format: date-time}
        version: {type: integer, description: Current version; every change adds one}
        kyc_status: {$ref: "#/components/schemas/KYCStatus"}
        risk_level: {$ref: "#/components/schemas/RiskLevel"}
        pep: {type: boolean}
        consents:
          type: object
          additionalProperties: {type: boolean}
        valid_from: {type: string, format: date-time}
