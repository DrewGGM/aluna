openapi: 3.1.0
info:
  title: Aluna API
  version: 0.1.0
  description: >-
    Core bancario. Dinero siempre como {"amount": <entero en unidades menores>, "currency": "<ISO 4217>"},
    nunca decimales. Errores RFC 9457 (application/problem+json) con un `code` estable. Cada operación
    declara el permiso que exige en `x-aluna-permission`. Los montos son enteros de 64 bits: un
    cliente JavaScript debe leerlos como BigInt, porque pasan de 2^53.
servers:
  - url: /
paths:
  /v1/ledger-accounts:
    post:
      operationId: createLedgerAccount
      summary: Crear una cuenta del ledger
      x-aluna-permission: ledger.accounts.create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateLedgerAccount"}
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LedgerAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/ledger-accounts/{id}:
    get:
      operationId: getLedgerAccount
      summary: Leer una cuenta del ledger
      x-aluna-permission: ledger.accounts.read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Cuenta
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LedgerAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/ledger-accounts/{id}/balance:
    get:
      operationId: getLedgerAccountBalance
      summary: Leer el saldo de una cuenta
      description: >-
        Sin parámetros, el saldo materializado, con los pendientes de los holds. Con `as_of_value_date`
        o `as_known_at`, el saldo bitemporal (FR-8): la suma de los entries con fecha valor hasta
        `as_of_value_date` y asentados hasta `as_known_at`, sin pendientes; el corte que falta no filtra.
        En una cuenta async el materializado puede ir atrasado y el bitemporal no.
      x-aluna-permission: ledger.balances.read
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: as_of_value_date
          in: query
          description: Fecha valor de corte (inclusive). Vacío (o 0001-01-01) cuenta como ausente.
          schema: {type: string, format: date}
        - name: as_known_at
          in: query
          description: >-
            Saldo como se conocía en este instante RFC 3339 (posted_at hasta él, inclusive; se aplica en
            UTC y en microsegundos, y así se devuelve). posted_at es la hora de inserción y no la del
            commit, así que el corte es definitivo solo para instantes anteriores a la transacción en
            curso más larga. Vacío (o el instante cero) cuenta como ausente.
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Saldo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Balance"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/transactions:
    post:
      operationId: postTransaction
      summary: Asentar una transacción balanceada
      description: >-
        Idempotente por `Idempotency-Key` (7 días): el mismo payload con la misma clave recibe la
        respuesta original (también un 4xx de negocio) sin asentar otra vez; otro payload es 422
        `idempotency_key_reused` y una solicitud que no ha terminado, 409 `request_in_progress`. Un
        5xx no se guarda: se puede reintentar con la misma clave.
      x-aluna-permission: ledger.transactions.post
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PostTransaction"}
      responses:
        "201":
          description: Transacción asentada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/transactions/{id}:
    get:
      operationId: getTransaction
      summary: Leer una transacción
      x-aluna-permission: ledger.transactions.read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Transacción
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/transactions/{id}/reversal:
    post:
      operationId: requestReversal
      summary: Pedir la reversa de una transacción
      description: >-
        Crea una solicitud `ledger.reversal` de maker-checker y responde 202 con ella. La reversa se asienta
        (sus entries con el signo contrario) cuando otra persona con `ledger.transactions.reverse` la aprueba
        en `POST /v1/approvals/{id}/approval`; si el ledger la rechaza entonces (ya revertida, periodo
        cerrado, fondos insuficientes), la solicitud queda `failed`. La reversa de una reversa se rechaza
        al pedirla (409 `reversal_of_reversal`). Idempotente por `Idempotency-Key`.
      x-aluna-permission: ledger.transactions.reverse
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RequestReversal"}
      responses:
        "202":
          description: Solicitud de reversa creada, pendiente de aprobación
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/holds:
    post:
      operationId: placeHold
      summary: Retener fondos de una cuenta
      description: >-
        Crea un hold pending sobre una cuenta sync: el importe deja de estar disponible hasta que se
        captura, se libera o vence. Idempotente por `Idempotency-Key`, como `POST /v1/transactions`.
      x-aluna-permission: ledger.holds.place
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlaceHold"}
      responses:
        "201":
          description: Hold creado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hold"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/holds/{id}/capture:
    post:
      operationId: captureHold
      summary: Asentar un hold, total o parcialmente
      description: >-
        Asienta el importe pedido de la cuenta del hold a su contrapartida y libera el resto. Un hold
        que ya no está pending responde 409 `hold_not_pending`; uno vencido, 409 `hold_expired`; un
        importe mayor que el retenido, 422 `amount_exceeds_hold`.
      x-aluna-permission: ledger.holds.capture
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CaptureHold"}
      responses:
        "200":
          description: Hold capturado y su transacción
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HoldCapture"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/holds/{id}/release:
    post:
      operationId: releaseHold
      summary: Liberar un hold
      x-aluna-permission: ledger.holds.release
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Hold liberado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hold"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/approvals:
    get:
      operationId: listApprovals
      summary: Solicitudes de maker-checker de la entidad
      description: >-
        Las 100 más recientes, de la más nueva a la más vieja. Con `status`, solo las de ese estado;
        `expired` es una pendiente que pasó sus 7 días.
      x-aluna-permission: approvals.read
      parameters:
        - name: status
          in: query
          required: false
          schema: {$ref: "#/components/schemas/ApprovalStatus"}
      responses:
        "200":
          description: Solicitudes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalList"}
        "400": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/approvals/{id}/approval:
    post:
      operationId: approveRequest
      summary: Aprobar una solicitud
      description: >-
        Corre el comando pedido con su payload original, en la misma transacción que marca la solicitud
        `approved`. Quien aprueba no puede ser quien pidió (403 `self_approval_forbidden`) y necesita el
        permiso del tipo de solicitud. Si el comando falla, la solicitud queda `failed` y se responde 200
        con ese estado. Idempotente por `Idempotency-Key`.
      x-aluna-permission: approvals.decide
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Solicitud decidida (approved o failed)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/approvals/{id}/rejection:
    post:
      operationId: rejectRequest
      summary: Rechazar una solicitud
      description: >-
        El comando no corre. Quien rechaza no puede ser quien pidió (403 `self_approval_forbidden`) y
        necesita el permiso del tipo de solicitud.
      x-aluna-permission: approvals.decide
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RejectApproval"}
      responses:
        "200":
          description: Solicitud rechazada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/parties:
    post:
      operationId: registerParty
      summary: Register a party
      description: >-
        Registers the reference data of a natural or legal person (FR-16) with its first version, in KYC
        `pending`: the KYC status only changes through maker-checker. The core keeps no names or
        documents: `external_ref` points to the onboarding system and is unique within the entity (409
        `party_already_registered`).
      x-aluna-permission: party.parties.create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterParty"}
      responses:
        "201":
          description: Registered party
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Party"}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/parties/{id}:
    get:
      operationId: getParty
      summary: Read a party
      description: The party with its current version.
      x-aluna-permission: party.parties.read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Party
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Party"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
  responses:
    Problem:
      description: Error RFC 9457
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: Unidades menores de la moneda (COP 100.000 = 10000000).
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    Problem:
      type: object
      required: [type, title, status, code, instance]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        instance: {type: string}
        trace_id:
          type: string
          description: Traza del request (W3C), para buscarla en los logs y en el backend de trazas.
    AccountKind:
      type: string
      enum: [asset, liability, equity, income, expense]
    BalanceMode:
      type: string
      enum: [sync, async]
    CreateLedgerAccount:
      type: object
      required: [code, kind, currency, balance_mode]
      properties:
        code: {type: string, minLength: 1}
        kind: {$ref: "#/components/schemas/AccountKind"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        balance_mode: {$ref: "#/components/schemas/BalanceMode"}
        lower_limit:
          type: integer
          format: int64
          description: Límite inferior del saldo natural, en unidades menores (0 por defecto).
    LedgerAccount:
      type: object
      required: [id, code, kind, currency, balance_mode, lower_limit]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        kind: {$ref: "#/components/schemas/AccountKind"}
        currency: {type: string}
        balance_mode: {$ref: "#/components/schemas/BalanceMode"}
        lower_limit: {type: integer, format: int64}
    Balance:
      type: object
      required: [account_id, posted, natural]
      properties:
        account_id: {type: string, format: uuid}
        as_of_value_date:
          type: string
          format: date
          description: Corte de fecha valor del saldo bitemporal; no viene en el materializado.
        as_known_at:
          type: string
          format: date-time
          description: Corte de conocimiento del saldo bitemporal; no viene en el materializado.
        posted:
          $ref: "#/components/schemas/Money"
          description: Saldo con signo (débito positivo, crédito negativo).
        natural:
          $ref: "#/components/schemas/Money"
          description: Saldo en la naturaleza de la cuenta (un depósito de cliente es positivo).
        pending_debits:
          $ref: "#/components/schemas/Money"
          description: Holds de débito pendientes (importe no negativo). Solo en el materializado.
        pending_credits:
          $ref: "#/components/schemas/Money"
          description: Holds de crédito pendientes (importe no negativo). Solo en el materializado.
        version:
          type: integer
          format: int64
          description: Versión del saldo materializado. Solo en el materializado.
    Entry:
      type: object
      required: [account_id, amount]
      properties:
        account_id: {type: string, format: uuid}
        amount:
          $ref: "#/components/schemas/Money"
          description: Con signo, débito positivo y crédito negativo.
    PostTransaction:
      type: object
      required: [code, value_date, business_date, source, external_ref, entries]
      properties:
        code: {type: string, minLength: 1}
        value_date: {type: string, format: date}
        business_date: {type: string, format: date}
        source: {type: string, minLength: 1}
        external_ref: {type: string, minLength: 1}
        entries:
          type: array
          minItems: 2
          items: {$ref: "#/components/schemas/Entry"}
    Transaction:
      type: object
      required: [id, code, value_date, business_date, posted_at, source, external_ref, entries]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        value_date: {type: string, format: date}
        business_date: {type: string, format: date}
        posted_at: {type: string, format: date-time}
        source: {type: string}
        external_ref: {type: string}
        entries:
          type: array
          items: {$ref: "#/components/schemas/Entry"}
    PlaceHold:
      type: object
      required: [account_id, counter_account_id, amount, expires_at]
      properties:
        account_id: {type: string, format: uuid, description: Cuenta cuyos fondos se retienen}
        counter_account_id: {type: string, format: uuid, description: Cuenta que recibe lo capturado}
        amount: {$ref: "#/components/schemas/Money"}
        expires_at: {type: string, format: date-time}
    CaptureHold:
      type: object
      required: [amount, business_date]
      properties:
        amount: {$ref: "#/components/schemas/Money"}
        business_date: {type: string, format: date}
    HoldStatus:
      type: string
      enum: [pending, captured, released, expired]
    Hold:
      type: object
      required: [id, account_id, counter_account_id, amount, captured, status, expires_at]
      properties:
        id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        counter_account_id: {type: string, format: uuid}
        amount: {$ref: "#/components/schemas/Money"}
        captured: {$ref: "#/components/schemas/Money"}
        status: {$ref: "#/components/schemas/HoldStatus"}
        expires_at: {type: string, format: date-time}
    HoldCapture:
      type: object
      required: [hold, transaction]
      properties:
        hold: {$ref: "#/components/schemas/Hold"}
        transaction: {$ref: "#/components/schemas/Transaction"}
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, failed, expired]
    Approval:
      type: object
      required: [id, kind, status, payload, maker, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, description: Tipo de solicitud; cada módulo registra los suyos}
        status: {$ref: "#/components/schemas/ApprovalStatus"}
        payload:
          description: El comando pedido, tal como se ejecutará al aprobarse.
          x-go-type: json.RawMessage
        maker: {type: string, description: sub de quien pidió}
        checker: {type: string, description: sub de quien decidió}
        reason: {type: string, description: Motivo del rechazo}
        result:
          description: Lo que devolvió el comando aprobado.
          x-go-type: json.RawMessage
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
    ApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Approval"}
    RejectApproval:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}
    RequestReversal:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}
        business_date:
          type: string
          format: date
          description: Fecha de negocio de la reversa; por defecto, la de la entidad al aprobarse.
    PartyKind:
      type: string
      enum: [natural, legal]
      description: Natural or legal person.
    KYCStatus:
      type: string
      enum: [pending, approved, rejected, suspended]
    RiskLevel:
      type: string
      enum: [low, medium, high]
    RegisterParty:
      type: object
      required: [kind, external_ref, risk_level, pep]
      properties:
        kind: {$ref: "#/components/schemas/PartyKind"}
        external_ref: {type: string, minLength: 1, maxLength: 255, description: Reference in the onboarding system}
        risk_level: {$ref: "#/components/schemas/RiskLevel"}
        pep:
          type: boolean
          description: Politically exposed person. Required; a missing or null value is rejected, never read as false.
          x-go-type: "*bool"
        consents:
          type: object
          additionalProperties: {type: boolean}
          propertyNames: {pattern: "^[a-z][a-z0-9_]{0,63}$"}
          maxProperties: 32
          description: >-
            Consent by name (for example, personal_data): lowercase letters, digits and underscores, starting
            with a letter, up to 64 characters.
    Party:
      type: object
      required: [id, kind, external_ref, created_at, version, kyc_status, risk_level, pep, consents, valid_from]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/PartyKind"}
        external_ref: {type: string}
        created_at: {type: string, format: date-time}
        version: {type: integer, description: Current version; every change adds one}
        kyc_status: {$ref: "#/components/schemas/KYCStatus"}
        risk_level: {$ref: "#/components/schemas/RiskLevel"}
        pep: {type: boolean}
        consents:
          type: object
          additionalProperties: {type: boolean}
        valid_from: {type: string, format: date-time}
