openapi: 3.1.0
info:
  title: Aluna API
  version: 0.1.0
  description: >-
    Core banking. Money is always {"amount": <integer in minor units>, "currency": "<ISO 4217>"}, never
    decimals. Errors are RFC 9457 (application/problem+json) with a stable `code`. Every operation
    declares the permission it requires in `x-aluna-permission`. Amounts are 64-bit integers: a
    JavaScript client must read them as BigInt, because they exceed 2^53.
servers:
  - url: /
paths:
  /v1/ledger-accounts:
    post:
      operationId: createLedgerAccount
      summary: Create a ledger account
      x-aluna-permission: ledger.accounts.create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateLedgerAccount"}
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LedgerAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/ledger-accounts/{id}:
    get:
      operationId: getLedgerAccount
      summary: Read a ledger account
      x-aluna-permission: ledger.accounts.read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LedgerAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/ledger-accounts/{id}/balance:
    get:
      operationId: getLedgerAccountBalance
      summary: Read an account balance
      description: >-
        Without parameters, the materialized balance, with the pending amounts of the holds. With
        `as_of_value_date` or `as_known_at`, the bitemporal balance (FR-8): the sum of the entries with a
        value date up to `as_of_value_date` and posted up to `as_known_at`, without pending amounts; a
        missing cutoff does not filter. On an async account the materialized balance may lag behind and the
        bitemporal one does not.
      x-aluna-permission: ledger.balances.read
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: as_of_value_date
          in: query
          description: Value date cutoff (inclusive). Empty (or 0001-01-01) counts as absent.
          schema: {type: string, format: date}
        - name: as_known_at
          in: query
          description: >-
            Balance as it was known at this RFC 3339 instant (posted_at up to it, inclusive; it applies
            in UTC and in microseconds, and is returned that way). posted_at is the insertion time and not
            the commit time, so the cutoff is final only for instants before the longest transaction in
            progress. Empty (or the zero instant) counts as absent.
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Balance"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/transactions:
    post:
      operationId: postTransaction
      summary: Post a balanced transaction
      description: >-
        Idempotent by `Idempotency-Key` (7 days): the same payload with the same key receives the
        original response (also a business 4xx) without posting again; another payload is 422
        `idempotency_key_reused` and a request that has not finished, 409 `request_in_progress`. A 5xx is
        not stored: it can be retried with the same key.
      x-aluna-permission: ledger.transactions.post
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PostTransaction"}
      responses:
        "201":
          description: Transaction posted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/transactions/{id}:
    get:
      operationId: getTransaction
      summary: Read a transaction
      x-aluna-permission: ledger.transactions.read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/transactions/{id}/reversal:
    post:
      operationId: requestReversal
      summary: Request the reversal of a transaction
      description: >-
        Creates a maker-checker `ledger.reversal` request and answers 202 with it. The reversal is posted
        (its entries with the opposite sign) when another person with `ledger.transactions.reverse`
        approves it in `POST /v1/approvals/{id}/approval`; if the ledger rejects it then (already
        reversed, period closed, insufficient funds), the request ends up `failed`. The reversal of a
        reversal is rejected when requested (409 `reversal_of_reversal`). Idempotent by
        `Idempotency-Key`.
      x-aluna-permission: ledger.transactions.reverse
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RequestReversal"}
      responses:
        "202":
          description: Reversal request created, pending approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/holds:
    post:
      operationId: placeHold
      summary: Hold funds of an account
      description: >-
        Creates a pending hold on a sync account: the amount stops being available until it is captured,
        released or expires. Idempotent by `Idempotency-Key`, like `POST /v1/transactions`.
      x-aluna-permission: ledger.holds.place
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlaceHold"}
      responses:
        "201":
          description: Hold created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hold"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/holds/{id}/capture:
    post:
      operationId: captureHold
      summary: Capture a hold, fully or partially
      description: >-
        Posts the requested amount from the hold's account to its counterpart and releases the rest. A hold
        that is no longer pending answers 409 `hold_not_pending`; an expired one, 409 `hold_expired`; an
        amount larger than the held one, 422 `amount_exceeds_hold`.
      x-aluna-permission: ledger.holds.capture
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CaptureHold"}
      responses:
        "200":
          description: Captured hold and its transaction
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HoldCapture"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/holds/{id}/release:
    post:
      operationId: releaseHold
      summary: Release a hold
      x-aluna-permission: ledger.holds.release
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Hold released
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hold"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/approvals:
    get:
      operationId: listApprovals
      summary: Maker-checker requests of the entity
      description: >-
        The 100 most recent, from newest to oldest. With `status`, only those in that status; `expired` is
        a pending one that passed its 7 days.
      x-aluna-permission: approvals.read
      parameters:
        - name: status
          in: query
          required: false
          schema: {$ref: "#/components/schemas/ApprovalStatus"}
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalList"}
        "400": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/approvals/{id}/approval:
    post:
      operationId: approveRequest
      summary: Approve a request
      description: >-
        Runs the requested command with its original payload, in the same transaction that marks the
        request `approved`. The approver cannot be the requester (403 `self_approval_forbidden`) and needs
        the permission of the request kind. If the command fails, the request ends up `failed` and the
        answer is 200 with that status. Idempotent by `Idempotency-Key`.
      x-aluna-permission: approvals.decide
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Request decided (approved or failed)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/approvals/{id}/rejection:
    post:
      operationId: rejectRequest
      summary: Reject a request
      description: >-
        The command does not run. The rejecter cannot be the requester (403 `self_approval_forbidden`) and
        needs the permission of the request kind.
      x-aluna-permission: approvals.decide
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RejectApproval"}
      responses:
        "200":
          description: Request rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/parties:
    post:
      operationId: registerParty
      summary: Register a party
      description: >-
        Registers the reference data of a natural or legal person (FR-16) with its first version, after
        screening it against the sanction lists (FR-42): in KYC `pending` if screening cleared it, and in
        `pending_screening` if it may match or the vendor did not answer, until compliance resolves its case at
        `POST /v1/screening-cases/{id}/resolution`. After that, the KYC status only changes through
        maker-checker. The core keeps no names or documents: `external_ref` points to the onboarding system and
        is unique within the entity (409 `party_already_registered`).
      x-aluna-permission: party.parties.create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterParty"}
      responses:
        "201":
          description: Registered party
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Party"}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/parties/{id}:
    get:
      operationId: getParty
      summary: Read a party
      description: The party with its current version.
      x-aluna-permission: party.parties.read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Party
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Party"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/parties/{id}/kyc-status-changes:
    post:
      operationId: requestKYCStatusChange
      summary: Request a KYC status change
      description: >-
        Creates a `party.kyc_status_change` maker-checker request and answers 202 with it. The new version of
        the party, with the new KYC status, is recorded when someone else with `party.kyc.change` approves it
        at `POST /v1/approvals/{id}/approval`. Valid changes: pending to approved or rejected, approved to
        suspended and suspended to approved; any other is 422 `invalid_kyc_transition` when requesting. If the
        party changed after the request (another version, even with the same status), approving it leaves the
        request `failed`.
        Idempotent by `Idempotency-Key`.
      x-aluna-permission: party.kyc.change
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RequestKYCStatusChange"}
      responses:
        "202":
          description: KYC change request created, pending approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/screening-cases/{id}/resolution:
    post:
      operationId: resolveScreeningCase
      summary: Request the resolution of a screening case
      description: >-
        Creates a `compliance.screening_resolution` maker-checker request and answers 202 with it (FR-42). The
        case is resolved when someone else with `compliance.screening.resolve` approves it at
        `POST /v1/approvals/{id}/approval`: `cleared` (not a match) leaves a party in KYC `pending`, and
        `confirmed` leaves it `rejected`. The case id comes in the `aluna.compliance.screening.pending.v1`
        event. A case that is no longer pending is 409 `case_already_resolved` when requesting; when
        approving, it leaves the request `failed`, as does a party that is no longer `pending_screening`.
        Idempotent by `Idempotency-Key`.
      x-aluna-permission: compliance.screening.resolve
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolveScreeningCase"}
      responses:
        "202":
          description: Resolution request created, pending approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/products:
    post:
      operationId: createProduct
      summary: Create a product
      description: >-
        Creates a product of the entity: a family of versions known by its `code`, which is unique within
        the entity (409 `product_already_exists`). Its conditions go in its versions.
      x-aluna-permission: products.products.create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateProduct"}
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Product"}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/products/{id}/versions:
    post:
      operationId: createProductVersion
      summary: Create a product version
      description: >-
        Stores the next version of the product as a `draft`. Its `definition` follows
        internal/products/schema/deposit-product.v1.json (422 `invalid_product_definition` if it does
        not). Idempotent by `Idempotency-Key`.
      x-aluna-permission: products.versions.create
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateProductVersion"}
      responses:
        "201":
          description: Version created as a draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductVersion"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/product-versions/{id}:
    get:
      operationId: getProductVersion
      summary: Read a product version
      description: The version with its definition and status.
      x-aluna-permission: products.versions.read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Product version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductVersion"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/product-versions/{id}/publication:
    post:
      operationId: requestProductPublication
      summary: Request the publication of a product version
      description: >-
        Marks the version `pending` (from then on its definition cannot change) and creates a
        `products.publish` maker-checker request; answers 202 with it. Only the author of the version asks
        for it (403 `not_version_author`), so whoever approves it did not write its conditions. When someone else with
        `products.versions.publish` approves it at `POST /v1/approvals/{id}/approval`, the version is
        `published`, the one in force is `retired` and `aluna.products.version.published.v1` is emitted.
        A published or retired version is 409 `version_not_publishable`; if, when approving, the version is
        no longer pending or a later one is in force, the request is left `failed`. Idempotent by
        `Idempotency-Key`.
      x-aluna-permission: products.versions.publish
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Publication request created, pending approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/market-parameters:
    post:
      operationId: requestMarketParameterLoad
      summary: Request the load of a market parameter
      description: >-
        Asks to load the value of a market parameter (FR-21) for a period, from `valid_from` (included) to
        `valid_to` (excluded): the usury rate by credit modality and the IBR by tenor (fractions up to 1),
        and the UVT, the SMMLV and the UVB in pesos (without modality). The parameters are the tenant's,
        not a legal entity's. Creates a `products.market_parameter_load` maker-checker request and answers
        202 with it; the value is stored when someone else with `products.market_parameters.load` approves
        it. An invalid value is 422 `invalid_market_parameter`; a period that overlaps another value of the
        same kind and modality is 409 `market_parameter_overlap` when requesting, and leaves the request
        `failed` if it overlaps when approving. A value is never changed: a correction is another period.
        Idempotent by `Idempotency-Key`.
      x-aluna-permission: products.market_parameters.load
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoadMarketParameter"}
      responses:
        "202":
          description: Load request created, pending approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    get:
      operationId: getMarketParameter
      summary: Read the value of a market parameter on a day
      description: >-
        The value that holds on `on`. With no value for that day it is 404 `no_market_parameter`: whoever
        needs it does not go on without it. An unknown kind, or a modality the kind does not take (or a
        missing one for the usury rate and the IBR), is 422 `invalid_market_parameter`.
      x-aluna-permission: products.market_parameters.read
      parameters:
        - name: kind
          in: query
          required: true
          schema: {$ref: "#/components/schemas/MarketKind"}
        - name: modality
          in: query
          required: false
          description: Credit modality of the usury rate or tenor of the IBR; absent for the others.
          schema: {type: string}
        - name: "on"
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        "200":
          description: Value in force
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MarketParameterValue"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/deposit-accounts:
    post:
      operationId: openDepositAccount
      summary: Open a deposit account
      description: >-
        Opens an account for a party of the entity with the version in force of a product of the entity
        (FR-19, FR-22): `active` if the party's KYC is approved, `pending` if the product allows a pending
        KYC (422 `kyc_not_satisfied` if it does not). A product without a published version is 409
        `no_published_version`. Idempotent by `Idempotency-Key`.
      x-aluna-permission: deposits.accounts.open
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OpenDepositAccount"}
      responses:
        "201":
          description: Account opened
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DepositAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/deposit-accounts/{id}:
    get:
      operationId: getDepositAccount
      summary: Read a deposit account
      description: Its balance is that of its `ledger_account_id`.
      x-aluna-permission: deposits.accounts.read
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Deposit account
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DepositAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/deposit-accounts/{id}/transactions:
    get:
      operationId: listDepositAccountTransactions
      summary: Read a deposit account's history
      description: >-
        The entries of its `ledger_account_id`, newest first by posted_at and then by the order they were
        posted (FR-44): a withdrawal shows its amount, its fees and its GMF as entries of one transaction.
        `next_cursor` reads the next page and is absent on the last one. Paging never repeats an entry nor
        skips one committed before the first page; one committed while paging shows up in a page not read
        yet or not at all. A cursor this endpoint did not issue, or a `limit` outside 1 to 200, is 400
        `invalid_request`.
      x-aluna-permission: deposits.accounts.read
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page; absent for the first one.
          schema: {type: string}
        - name: limit
          in: query
          required: false
          description: Entries per page.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: A page of the history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountHistory"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/deposit-accounts/{id}/deposits:
    post:
      operationId: createDeposit
      summary: Deposit cash into an account
      description: >-
        Posts the amount from the product's cash account into the account, on the entity's business date
        (FR-23). Only an `active` account moves money (409 `account_not_active`), within the limits of its
        product (FR-24: 422 `limit_exceeded`, with the limit in `detail`; nothing is credited in part). Idempotent by
        `Idempotency-Key`; once the key expires (7 days), the same key is 409 `duplicate_external_ref` and
        moves nothing.
      x-aluna-permission: deposits.deposits.post
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CashMovement"}
      responses:
        "201":
          description: Deposit posted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/deposit-accounts/{id}/withdrawals:
    post:
      operationId: createWithdrawal
      summary: Withdraw cash from an account
      description: >-
        Posts the amount from the account to the product's cash account, like a deposit (an `active` account,
        the business date), with its fees and its GMF in the same transaction (FR-28, FR-29): those of the
        quote `quote_id` names, exactly, or without one those it costs now. A quote that is not of this
        account, operation and amount, was used, expired or no longer has the GMF exemption it quoted is 409
        `quote_unavailable`. Without funds for all of it it is 422 `insufficient_funds`, and over a limit of
        its product it is 422 `limit_exceeded` (with the limit in `detail`). Idempotent by
        `Idempotency-Key`, like a deposit.
      x-aluna-permission: deposits.withdrawals.post
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CashWithdrawal"}
      responses:
        "201":
          description: Withdrawal posted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/quotes:
    post:
      operationId: createQuote
      summary: Quote what an operation costs
      description: >-
        Quotes a withdrawal or a transfer from a deposit account of the entity before it is done (FR-28,
        US-7): the fees of its product for the operation, with their exemptions decided on the account
        (its party, its balance and the quotes it used this month), and its GMF (FR-29): 4 per thousand of
        what the exemption of an exempt account does not cover. Valid for 5 minutes. An amount that is not
        positive or not in the account's currency is 422 `invalid_quote`.
      x-aluna-permission: pricing.quotes.create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateQuote"}
      responses:
        "201":
          description: Quote
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quote"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/payment-orders:
    post:
      operationId: createPaymentOrder
      summary: Initiate an outgoing payment
      description: >-
        Initiates a payment from a deposit account of the entity to a beneficiary at another bank, by account
        number or by key, through a rail (FR-31), and answers 202 with the order. Its beneficiary is screened
        first (FR-42): if screening does not clear it (a possible match, or no answer), the order is
        `pending_screening` and nothing is held or charged until compliance resolves its case. If it does, the
        amount and its charges (the fees and the GMF of a transfer, those of `quote_id` if it names one) are held
        on the account and the order is `held`, to be sent. Without funds for all of it it is 422
        `insufficient_funds` and nothing is stored; an account that is not active is 409 `account_not_active`.
        The rail's clearing account (`L.CLEARING.SIMBREB`, in the account's currency) must exist in the entity's
        ledger. Idempotent by `Idempotency-Key`; a retry with the same key after the key store forgot it is 409
        `duplicate_payment`, not a second payment.
      x-aluna-permission: payments.orders.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePaymentOrder"}
      responses:
        "202":
          description: Order initiated, held or pending screening
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentOrder"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/reconciliation/statements:
    post:
      operationId: importStatement
      summary: Import a rail's statement
      description: >-
        Takes what a rail reports of one day, camt.053 simplified (FR-34), once per reference, and pairs each
        line with its payment order by `end_to_end_id`, direction and amount. An exception opens a break owned by
        who imported the statement: a line in another amount, a line without an order, a line of an order the
        core did not settle and an order of the day the rail does not report. The answer counts the lines, the
        matched and the exceptions. A statement already imported is 409 `duplicate_statement`, and every line must
        be booked on the statement's date. Idempotent by `Idempotency-Key`.
      x-aluna-permission: reconciliation.statements.import
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ImportStatement"}
      responses:
        "201":
          description: Statement imported
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatementImport"}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/reconciliation/breaks:
    get:
      operationId: listBreaks
      summary: List the breaks
      description: >-
        The entity's breaks, newest first, those of `status` if it says one: the differences the continuous
        controls (FR-33) and the statements (FR-34) found, with their owner and where they stand.
      x-aluna-permission: reconciliation.breaks.read
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved]
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        "200":
          description: A page of breaks
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BreakList"}
        "400": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/reconciliation/breaks/{id}/resolution:
    post:
      operationId: resolveBreak
      summary: Resolve a break
      description: >-
        Closes an open break with its cause, mandatory, and who resolved it (FR-34). A difference that is still
        there opens another on the next run of its control. One already resolved is 409 `break_already_resolved`.
        Idempotent by `Idempotency-Key`.
      x-aluna-permission: reconciliation.breaks.resolve
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolveBreak"}
      responses:
        "200":
          description: Break resolved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Break"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/transfers:
    post:
      operationId: createTransfer
      summary: Transfer between two deposit accounts
      description: >-
        Moves the amount between two `active` deposit accounts of the entity (FR-23, US-5), on its business
        date: 409 `account_not_active` if either is not, 422 `insufficient_funds` without funds, 422
        `limit_exceeded` over a limit of the origin (a debit) or of the destination (a credit), and 422
        `invalid_movement` to the same account. The origin pays the fees and the GMF of the transfer, as a
        withdrawal does, with `quote_id` or without it (409 `quote_unavailable`). Idempotent by
        `Idempotency-Key`, like a deposit.
      x-aluna-permission: deposits.transfers.post
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTransfer"}
      responses:
        "201":
          description: Transfer posted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transaction"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/deposit-accounts/{id}/gmf-exemption:
    post:
      operationId: createGMFExemption
      summary: Exempt an account from GMF
      description: >-
        Marks the account as exempt from GMF (FR-29): its party's debits from its exempt accounts pay no GMF
        up to 350 UVT a month. The product must allow it and the account must be in COP and not closed (422
        `gmf_not_eligible`). With the exemption on a single account, the entity's default, a party with
        another exempt account is 409 `gmf_exemption_taken`, as is an account already exempt.
      x-aluna-permission: pricing.gmf_exemptions.create
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "201":
          description: Account exempt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GMFExemption"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
  responses:
    Problem:
      description: RFC 9457 error
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: Minor units of the currency (COP 100,000 = 10000000).
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    Problem:
      type: object
      required: [type, title, status, code, instance]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        instance: {type: string}
        trace_id:
          type: string
          description: Trace of the request (W3C), to look it up in the logs and the tracing backend.
    AccountKind:
      type: string
      enum: [asset, liability, equity, income, expense]
    BalanceMode:
      type: string
      enum: [sync, async]
    CreateLedgerAccount:
      type: object
      required: [code, kind, currency, balance_mode]
      properties:
        code: {type: string, minLength: 1}
        kind: {$ref: "#/components/schemas/AccountKind"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        balance_mode: {$ref: "#/components/schemas/BalanceMode"}
        lower_limit:
          type: integer
          format: int64
          description: Lower limit of the natural balance, in minor units (0 by default).
    LedgerAccount:
      type: object
      required: [id, code, kind, currency, balance_mode, lower_limit]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        kind: {$ref: "#/components/schemas/AccountKind"}
        currency: {type: string}
        balance_mode: {$ref: "#/components/schemas/BalanceMode"}
        lower_limit: {type: integer, format: int64}
    Balance:
      type: object
      required: [account_id, posted, natural]
      properties:
        account_id: {type: string, format: uuid}
        as_of_value_date:
          type: string
          format: date
          description: Value date cutoff of the bitemporal balance; absent in the materialized one.
        as_known_at:
          type: string
          format: date-time
          description: Knowledge cutoff of the bitemporal balance; absent in the materialized one.
        posted:
          $ref: "#/components/schemas/Money"
          description: Signed balance (debit positive, credit negative).
        natural:
          $ref: "#/components/schemas/Money"
          description: Balance in the account's natural sign (a customer deposit is positive).
        pending_debits:
          $ref: "#/components/schemas/Money"
          description: Pending debit holds (non-negative amount). Only in the materialized balance.
        pending_credits:
          $ref: "#/components/schemas/Money"
          description: Pending credit holds (non-negative amount). Only in the materialized balance.
        version:
          type: integer
          format: int64
          description: Version of the materialized balance. Only in the materialized balance.
    Entry:
      type: object
      required: [account_id, amount]
      properties:
        account_id: {type: string, format: uuid}
        amount:
          $ref: "#/components/schemas/Money"
          description: Signed, debit positive and credit negative.
    PostTransaction:
      type: object
      required: [code, value_date, business_date, source, external_ref, entries]
      properties:
        code: {type: string, minLength: 1}
        value_date: {type: string, format: date}
        business_date: {type: string, format: date}
        source: {type: string, minLength: 1}
        external_ref: {type: string, minLength: 1}
        entries:
          type: array
          minItems: 2
          items: {$ref: "#/components/schemas/Entry"}
    Transaction:
      type: object
      required: [id, code, value_date, business_date, posted_at, source, external_ref, entries]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        value_date: {type: string, format: date}
        business_date: {type: string, format: date}
        posted_at: {type: string, format: date-time}
        source: {type: string}
        external_ref: {type: string}
        entries:
          type: array
          items: {$ref: "#/components/schemas/Entry"}
    PlaceHold:
      type: object
      required: [account_id, counter_account_id, amount, expires_at]
      properties:
        account_id: {type: string, format: uuid, description: Account whose funds are held}
        counter_account_id: {type: string, format: uuid, description: Account that receives the captured amount}
        amount: {$ref: "#/components/schemas/Money"}
        expires_at: {type: string, format: date-time}
    CaptureHold:
      type: object
      required: [amount, business_date]
      properties:
        amount: {$ref: "#/components/schemas/Money"}
        business_date: {type: string, format: date}
    HoldStatus:
      type: string
      enum: [pending, captured, released, expired]
    Hold:
      type: object
      required: [id, account_id, counter_account_id, amount, captured, status, expires_at]
      properties:
        id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        counter_account_id: {type: string, format: uuid}
        amount: {$ref: "#/components/schemas/Money"}
        captured: {$ref: "#/components/schemas/Money"}
        status: {$ref: "#/components/schemas/HoldStatus"}
        expires_at: {type: string, format: date-time}
    HoldCapture:
      type: object
      required: [hold, transaction]
      properties:
        hold: {$ref: "#/components/schemas/Hold"}
        transaction: {$ref: "#/components/schemas/Transaction"}
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, failed, expired]
    CreatePaymentOrder:
      type: object
      required: [account_id, amount, rail, creditor]
      properties:
        account_id: {type: string, format: uuid, description: Deposit account the payment leaves from}
        amount: {$ref: "#/components/schemas/Money", description: "Positive, in the account's currency"}
        rail:
          type: string
          enum: [simbreb]
          description: The simulated Bre-B rail, the only one for now
        creditor: {$ref: "#/components/schemas/PaymentParty"}
        quote_id: {type: string, format: uuid, description: "Quote of this payment (POST /v1/quotes, a transfer); without one it is priced as it is made"}
    PaymentParty:
      type: object
      description: A party at its bank, by account number or by key (a Bre-B "llave"), one of the two.
      properties:
        account_number: {type: string, minLength: 1, maxLength: 64}
        key: {type: string, minLength: 1, maxLength: 128}
    PaymentOrder:
      type: object
      required: [id, account_id, rail, amount, status, end_to_end_id, instr_id, tx_id]
      properties:
        id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        rail: {type: string}
        amount: {$ref: "#/components/schemas/Money"}
        status:
          type: string
          enum: [initiated, screening, pending_screening, held, sent, settled, rejected, returned]
        end_to_end_id: {type: string, description: ISO 20022 EndToEndId}
        instr_id: {type: string, description: ISO 20022 InstrId}
        tx_id: {type: string, description: ISO 20022 TxId}
        held: {$ref: "#/components/schemas/Money", description: "What is held on the account: the amount, its fees and its GMF"}
    Approval:
      type: object
      required: [id, kind, status, payload, maker, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, description: "Request kind; each module registers its own"}
        status: {$ref: "#/components/schemas/ApprovalStatus"}
        payload:
          description: The requested command, as it will run when approved.
          x-go-type: json.RawMessage
        maker: {type: string, description: sub of the requester}
        checker: {type: string, description: sub of the decider}
        reason: {type: string, description: Rejection reason}
        result:
          description: What the approved command returned.
          x-go-type: json.RawMessage
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
    ApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Approval"}
    RejectApproval:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}
    RequestReversal:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}
        business_date:
          type: string
          format: date
          description: Business date of the reversal; by default, the entity's when approved.
    PartyKind:
      type: string
      enum: [natural, legal]
      description: Natural or legal person.
    KYCStatus:
      type: string
      enum: [pending, approved, rejected, suspended, pending_screening]
    RiskLevel:
      type: string
      enum: [low, medium, high]
    RegisterParty:
      type: object
      required: [kind, external_ref, risk_level, pep]
      properties:
        kind: {$ref: "#/components/schemas/PartyKind"}
        external_ref: {type: string, minLength: 1, maxLength: 255, description: Reference in the onboarding system}
        risk_level: {$ref: "#/components/schemas/RiskLevel"}
        pep:
          type: boolean
          description: Politically exposed person. Required; a missing or null value is rejected, never read as false.
          x-go-type: "*bool"
        consents:
          type: object
          additionalProperties: {type: boolean}
          propertyNames: {pattern: "^[a-z][a-z0-9_]{0,63}$"}
          maxProperties: 32
          description: >-
            Consent by name (for example, personal_data): lowercase letters, digits and underscores, starting
            with a letter, up to 64 characters.
    Party:
      type: object
      required: [id, kind, external_ref, created_at, version, kyc_status, risk_level, pep, consents, valid_from]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/PartyKind"}
        external_ref: {type: string}
        created_at: {type: string, format: date-time}
        version: {type: integer, description: Current version; every change adds one}
        kyc_status: {$ref: "#/components/schemas/KYCStatus"}
        risk_level: {$ref: "#/components/schemas/RiskLevel"}
        pep: {type: boolean}
        consents:
          type: object
          additionalProperties: {type: boolean}
        valid_from: {type: string, format: date-time}
    CreateProduct:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: Unique within the entity; lowercase letters, digits and underscores, starting with a letter.
        name: {type: string, minLength: 1, maxLength: 200}
    Product:
      type: object
      required: [id, code, name, created_at]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
    ProductVersionStatus:
      type: string
      enum: [draft, pending, published, retired]
    CreateProductVersion:
      type: object
      required: [definition]
      properties:
        definition:
          description: The definition, following deposit-product.v1.json.
          x-go-type: json.RawMessage
    ProductVersion:
      type: object
      required: [id, product_id, version, status, definition, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        version: {type: integer, description: Number of the version within the product, from 1}
        status: {$ref: "#/components/schemas/ProductVersionStatus"}
        definition:
          description: The definition, following deposit-product.v1.json, as stored (its keys may come in another order).
          x-go-type: json.RawMessage
        created_by: {type: string, description: sub of the author}
        created_at: {type: string, format: date-time}
        published_at: {type: string, format: date-time}
    MarketKind:
      type: string
      enum: [usury_rate, uvt, smmlv, uvb, ibr]
    LoadMarketParameter:
      type: object
      required: [kind, valid_from, valid_to, value]
      properties:
        kind: {$ref: "#/components/schemas/MarketKind"}
        modality:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: >-
            Credit modality of the usury rate or tenor of the IBR (lowercase letters, digits and _, starting
            with a letter, up to 64 characters); absent for the others.
        valid_from: {type: string, format: date, description: First day the value holds}
        valid_to: {type: string, format: date, description: First day the value no longer holds}
        value:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,8})?$"
          description: >-
            Decimal with up to 8 decimals, as text so it is not read as a float: a rate as an effective
            annual fraction (0.2531 is 25.31 % EA; the IBR is loaded in its effective annual form, not the
            nominal one), the UVT, the SMMLV and the UVB in pesos.
    MarketParameterValue:
      type: object
      required: [kind, "on", value]
      properties:
        kind: {$ref: "#/components/schemas/MarketKind"}
        modality: {type: string}
        "on": {type: string, format: date}
        value: {type: string, description: Decimal as text}
    OpenDepositAccount:
      type: object
      required: [party_id, product_id]
      properties:
        party_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
    DepositAccountStatus:
      type: string
      enum: [pending, active, frozen, dormant, closed]
    DepositAccount:
      type: object
      required: [id, party_id, product_version_id, ledger_account_id, currency, status, opened_on, last_customer_activity_on]
      properties:
        id: {type: string, format: uuid}
        party_id: {type: string, format: uuid}
        product_version_id: {type: string, format: uuid, description: Version of the product the account is anchored to}
        ledger_account_id: {type: string, format: uuid, description: Liability ledger account that holds its money}
        currency: {type: string}
        status: {$ref: "#/components/schemas/DepositAccountStatus"}
        opened_on: {type: string, format: date}
        last_customer_activity_on: {type: string, format: date, description: Business date of the customer's last movement}
    AccountHistory:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: {$ref: "#/components/schemas/HistoryEntry"}
        next_cursor: {type: string, description: Cursor of the next page; absent on the last one}
    HistoryEntry:
      type: object
      required: [transaction_id, code, amount, value_date, posted_at]
      properties:
        transaction_id: {type: string, format: uuid}
        code: {type: string, description: Code of its transaction}
        amount:
          $ref: "#/components/schemas/Money"
          description: Signed, debit positive and credit negative.
        value_date: {type: string, format: date}
        posted_at: {type: string, format: date-time}
    CashMovement:
      type: object
      required: [amount]
      properties:
        amount: {$ref: "#/components/schemas/Money", description: "Positive, in the account's currency"}
    CashWithdrawal:
      type: object
      required: [amount]
      properties:
        amount: {$ref: "#/components/schemas/Money", description: "Positive, in the account's currency"}
        quote_id: {type: string, format: uuid, description: "Quote of this withdrawal (POST /v1/quotes); without one it is priced as it is done"}
    CreateTransfer:
      type: object
      required: [from_account_id, to_account_id, amount]
      properties:
        from_account_id: {type: string, format: uuid, description: Deposit account the money leaves}
        to_account_id: {type: string, format: uuid, description: Deposit account that receives it}
        amount: {$ref: "#/components/schemas/Money", description: "Positive, in the accounts' currency"}
        quote_id: {type: string, format: uuid, description: "Quote of this transfer from the origin; without one it is priced as it is done"}
    QuoteOperation:
      type: string
      enum: [withdrawal, transfer]
    CreateQuote:
      type: object
      required: [account_id, operation, amount]
      properties:
        account_id: {type: string, format: uuid, description: Deposit account the operation is done on}
        operation: {$ref: "#/components/schemas/QuoteOperation"}
        amount: {$ref: "#/components/schemas/Money", description: "Positive, in the account's currency"}
    QuotedFee:
      type: object
      required: [code, amount]
      properties:
        code: {type: string, description: The fee's code in the product}
        amount: {$ref: "#/components/schemas/Money"}
    Quote:
      type: object
      required: [id, account_id, operation, amount, fees, total_fees, gmf, expires_at]
      properties:
        id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        operation: {$ref: "#/components/schemas/QuoteOperation"}
        amount: {$ref: "#/components/schemas/Money"}
        fees:
          type: array
          items: {$ref: "#/components/schemas/QuotedFee"}
        total_fees: {$ref: "#/components/schemas/Money", description: What the fees add up to}
        gmf: {$ref: "#/components/schemas/Money", description: "GMF the operation withholds: 4 per thousand of what the exemption does not cover"}
        expires_at: {type: string, format: date-time}
    GMFExemption:
      type: object
      required: [account_id, party_id, marked_at]
      properties:
        account_id: {type: string, format: uuid}
        party_id: {type: string, format: uuid}
        marked_at: {type: string, format: date-time}
    ImportStatement:
      type: object
      required: [rail, statement_ref, statement_date, lines]
      properties:
        rail:
          type: string
          enum: [simbreb]
          description: The simulated Bre-B rail, the only one for now
        statement_ref: {type: string, maxLength: 35, description: "The statement's identification in the rail"}
        statement_date: {type: string, format: date}
        lines:
          type: array
          maxItems: 5000
          items: {$ref: "#/components/schemas/StatementLine"}
    StatementLine:
      type: object
      required: [end_to_end_id, direction, amount, booking_date]
      properties:
        end_to_end_id: {type: string, maxLength: 35}
        direction:
          type: string
          enum: [incoming, outgoing]
        amount: {$ref: "#/components/schemas/Money"}
        booking_date: {type: string, format: date}
    StatementImport:
      type: object
      required: [id, lines, matched, exceptions]
      properties:
        id: {type: string, format: uuid, description: "The statement's id, the `statement_id` of its breaks"}
        lines: {type: integer}
        matched: {type: integer}
        exceptions: {type: integer}
    Break:
      type: object
      required: [id, control, subject, difference, status, owner, opened_at]
      properties:
        id: {type: string, format: uuid}
        control:
          type: string
          description: The control that found it, or `statement_match` for a statement
        subject:
          type: string
          description: What does not square, a currency, a ledger account, or a direction and an end-to-end id
        reason:
          type: string
          description: Why a statement opened it
        statement_id: {type: string, format: uuid, description: "The statement that opened it"}
        difference: {$ref: "#/components/schemas/Money"}
        status:
          type: string
          enum: [open, resolved]
        owner: {type: string}
        cause: {type: string}
        resolved_by: {type: string}
        opened_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time}
    BreakList:
      type: object
      required: [breaks]
      properties:
        breaks:
          type: array
          items: {$ref: "#/components/schemas/Break"}
        next_cursor: {type: string}
    ResolveBreak:
      type: object
      required: [cause]
      properties:
        cause: {type: string, description: "Why it happened, of 1 to 1000 characters"}
    ResolveScreeningCase:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [cleared, confirmed]
          description: "`cleared` if the subject is not on the lists, `confirmed` if the match is real"
    RequestKYCStatusChange:
      type: object
      required: [kyc_status]
      properties:
        kyc_status: {$ref: "#/components/schemas/KYCStatus"}
