# Core roles and permissions (ADR-0014). Each permission is the x-aluna-permission of an operation in
# api/openapi.yaml; anything not listed here is denied. "all" grants the permission over any resource of the
# token's legal entity; "own", only over those of its party_id (a channel acting for a customer, TH-3).

# A customer's app or channel: reads its own accounts. As long as no resource has an owner (deposit
# accounts, T-047), "own" answers 404 to everything.
channel:
  own:
    - ledger.accounts.read
    - ledger.balances.read

# Day-to-day operations: parties, products, accounts, manual entries and holds, and deciding maker-checker
# requests (the permission for each request's type is required separately).
operator:
  all:
    - approvals.read
    - approvals.decide
    - party.parties.create
    - party.parties.read
    - party.kyc.change
    - products.products.create
    - products.versions.create
    - products.versions.read
    - products.versions.publish
    - ledger.accounts.create
    - ledger.accounts.read
    - ledger.balances.read
    - ledger.transactions.post
    - ledger.transactions.read
    - ledger.transactions.reverse
    - ledger.holds.place
    - ledger.holds.capture
    - ledger.holds.release

# Finance: queries, accounting adjustments, reversals, product publications (rates and fees) and deciding
# requests.
finance:
  all:
    - approvals.read
    - approvals.decide
    - products.versions.read
    - products.versions.publish
    - ledger.accounts.read
    - ledger.balances.read
    - ledger.transactions.post
    - ledger.transactions.read
    - ledger.transactions.reverse

# Compliance: queries, KYC changes and deciding requests.
compliance:
  all:
    - approvals.read
    - approvals.decide
    - party.parties.read
    - party.kyc.change
    - products.versions.read
    - ledger.accounts.read
    - ledger.balances.read
    - ledger.transactions.read

# Internal audit or statutory auditor: read only.
auditor:
  all:
    - approvals.read
    - party.parties.read
    - products.versions.read
    - ledger.accounts.read
    - ledger.balances.read
    - ledger.transactions.read

# Internal services (rails, jobs): move money with holds and entries.
system:
  all:
    - ledger.accounts.read
    - ledger.balances.read
    - ledger.transactions.post
    - ledger.transactions.read
    - ledger.holds.place
    - ledger.holds.capture
    - ledger.holds.release
