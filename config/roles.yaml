# Core roles and permissions (ADR-0014). Each permission is the x-aluna-permission of an operation in
# api/openapi.yaml; anything not listed here is denied. "all" grants the permission over any resource of the
# token's legal entity; "own", only over those of its party_id (a channel acting for a customer, TH-3).

# A customer's app or channel: reads its own accounts. As long as the authorizer does not check who owns a
# resource (a deposit account's is its party), "own" answers 404 to everything.
channel:
  own:
    - ledger.accounts.read
    - ledger.balances.read

# Day-to-day operations: parties, products, deposit accounts with their movements and status changes, payment
# orders, ledger accounts, manual entries and holds, and deciding maker-checker requests (the permission for each
# request's type is required separately).
operator:
  all:
    - approvals.read
    - approvals.decide
    - party.parties.create
    - party.parties.read
    - party.kyc.change
    - products.products.create
    - products.versions.create
    - products.versions.read
    - products.versions.publish
    - products.market_parameters.read
    - deposits.accounts.open
    - deposits.accounts.read
    - deposits.accounts.change_status
    - deposits.deposits.post
    - deposits.withdrawals.post
    - deposits.transfers.post
    - payments.orders.create
    - payments.orders.read
    - payments.suspense.credit
    - payments.suspense.return
    - pricing.quotes.create
    - pricing.gmf_exemptions.create
    - ledger.accounts.create
    - ledger.accounts.read
    - ledger.balances.read
    - ledger.transactions.post
    - ledger.transactions.read
    - ledger.transactions.reverse
    - ledger.holds.place
    - ledger.holds.capture
    - ledger.holds.release
    - calendar.business_date.read

# Finance: queries, accounting adjustments, reversals, product publications (rates and fees), market
# parameters and deciding requests.
finance:
  all:
    - approvals.read
    - approvals.decide
    - products.versions.read
    - products.versions.publish
    - products.market_parameters.load
    - products.market_parameters.read
    - deposits.accounts.read
    - payments.orders.read
    - ledger.accounts.read
    - ledger.balances.read
    - ledger.transactions.post
    - ledger.transactions.read
    - ledger.transactions.reverse
    - accounting.cuif_mappings.load
    - accounting.periods.close
    - accounting.gl.read
    - reconciliation.statements.import
    - reconciliation.breaks.read
    - reconciliation.breaks.resolve
    - calendar.business_date.read

# Compliance: queries, KYC changes, screening resolutions and deciding requests.
compliance:
  all:
    - approvals.read
    - approvals.decide
    - party.parties.read
    - party.kyc.change
    - compliance.screening.read
    - compliance.screening.resolve
    - products.versions.read
    - products.market_parameters.read
    - deposits.accounts.read
    - payments.orders.read
    - ledger.accounts.read
    - ledger.balances.read
    - ledger.transactions.read
    - webhooks.events.read
    - calendar.business_date.read

# Internal audit or statutory auditor: read only.
auditor:
  all:
    - approvals.read
    - party.parties.read
    - compliance.screening.read
    - products.versions.read
    - products.market_parameters.read
    - deposits.accounts.read
    - payments.orders.read
    - ledger.accounts.read
    - ledger.balances.read
    - ledger.transactions.read
    - reconciliation.breaks.read
    - accounting.gl.read
    - webhooks.events.read
    - calendar.business_date.read

# Internal services (rails, jobs, the operator's scheduler): move money with holds and entries, and roll the business
# date over at the end of each business day.
system:
  all:
    - ledger.accounts.read
    - ledger.balances.read
    - ledger.transactions.post
    - ledger.transactions.read
    - ledger.holds.place
    - ledger.holds.capture
    - ledger.holds.release
    - calendar.business_date.read
    - calendar.business_date.rollover

# Integrators: follow the entity's events (FR-46), by reading them or registering webhooks, and nothing else, so a
# token to follow them cannot move money.
integrator:
  all:
    - webhooks.events.read
    - webhooks.endpoints.create
