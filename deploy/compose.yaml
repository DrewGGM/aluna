# PostgreSQL local para desarrollo. Las credenciales son solo de desarrollo.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aluna
      POSTGRES_PASSWORD: aluna
      POSTGRES_DB: aluna
    ports:
      - "127.0.0.1:5432:5432" # solo local: la contraseña es de desarrollo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aluna -d aluna"]
      interval: 5s
      timeout: 5s
      retries: 10
