version: "2"
sql:
  - engine: postgresql
    # Solo las migraciones del ledger: con todo migrations/, sqlc generaría aquí los modelos de otros módulos.
    schema: [migrations/0001_schemas.sql, migrations/0002_ledger.sql, migrations/0004_holds.sql, migrations/0005_async_balances.sql]
    queries: internal/ledger/internal/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: internal/ledger/internal/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/DrewGGM/aluna/internal/ids.ID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/DrewGGM/aluna/internal/ids
              type: ID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: date
            go_type: time.Time
          - db_type: xid8
            go_type: uint64
  - engine: postgresql
    schema: [migrations/0001_schemas.sql, migrations/0006_calendar.sql]
    queries: internal/calendar/internal/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: internal/calendar/internal/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/DrewGGM/aluna/internal/ids.ID
          - db_type: date
            go_type: time.Time
          - db_type: timestamptz
            go_type: time.Time
