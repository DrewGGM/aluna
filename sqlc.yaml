version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/ledger/internal/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: internal/ledger/internal/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/DrewGGM/aluna/internal/ids.ID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: date
            go_type: time.Time
